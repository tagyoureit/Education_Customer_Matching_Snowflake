      - name: CUSTOMER_NAME
        description: The name of the customer or organization that has a relationship with the company, such as a school or bookstore.
        expr: CUSTOMER_NAME
        data_type: VARCHAR(16777216)
        sample_values:
          - Kings College Bookstore
          - District 73 Gilford
          - Glasscock County Ink Sch District
      - name: EDIT_DISTANCE
        description: Levenshtein distance between two input strings. It is the number of single-character insertions, deletions, or substitutions needed to convert one string to another.  Distance between the customer_full_details in customer_address and customer_identifier tables.
        expr: EDIT_DISTANCE
        data_type: NUMBER(38, 0)
      - name: ENRICHED_INDICATOR
        description: Indicates whether the customer identifier has been successfully enriched with additional information or if an error occurred during the enrichment process.
        expr: ENRICHED_INDICATOR
        data_type: VARCHAR(20)
        sample_values:
          - ERROR
          - VALID
      - name: IDENTIFIER_TYPE
        description: The type of identifier used to uniquely identify a customer, such as a Northwest Evaluation Association (NWEA) ID, a Salesforce.com (SFDC) ID, an AgileEd ID, or a National Center for Education Statistics (NCES) ID.
        expr: IDENTIFIER_TYPE
        data_type: VARCHAR(16777216)
        sample_values:
          - NWEA SFDC ID
          - AgileEd ID
          - NCES ID
      - name: IDENTIFIER_VALUE
        description: Unique identifier for a customer.
        expr: IDENTIFIER_VALUE
        data_type: VARCHAR(16777216)
        sample_values:
          - MB9WSS0GAJ55
          - 4PBPJTILYV7P
          - 5GSSAJBDW9E7
      - name: PHONE
        description: The customer's phone number, which can be used to contact them directly.
        expr: PHONE
        data_type: VARCHAR(16777216)
        sample_values:
          - (315) 697-6372
          - NOT AVAILABLE
          - (575) 538-2547
      - name: POSTAL_CODE
        description: The postal code or zip code associated with a customer's mailing address.
        expr: POSTAL_CODE
        data_type: VARCHAR(16777216)
        sample_values:
          - 92056-2648
          - KT2 7PW
          - 33324-201T
      - name: POSTALCODE_EXTENSION
        description: The four-digit extension of the postal code that further identifies a geographic segment within a five-digit postal code area.
        expr: POSTALCODE_EXTENSION
        data_type: VARCHAR(16777216)
        sample_values:
          - '1599'
          - NOT AVAILABLE
      - name: SEARCH_CONFIDENCE_SCORE
        synonyms:
          - search_accuracy_score
          - search_certainty_score
          - search_precision_score
          - search_reliability_score
          - search_trust_score
        description: A score indicating the level of confidence in the accuracy of the customer's identification from the cortex search results, with higher scores representing a higher degree of confidence.
        expr: SEARCH_CONFIDENCE_SCORE
        data_type: FLOAT
      - name: STATE
        description: The two-letter code representing the state where the customer is located, prefixed with the country code "US".
        expr: STATE
        data_type: VARCHAR(16777216)
        sample_values:
          - US-NY
          - US-TX
          - US-NC
      - name: VERIFICATION_MESSAGE
        description: This column stores the verification status of various customer identifier fields, indicating whether each field matches the expected value, with "true" indicating a match and "false" indicating a mismatch, and providing a reason for the verification outcome.
        expr: VERIFICATION_MESSAGE
        data_type: VARIANT
        sample_values:
          - |-
            {
              "address_line_1": true,
              "address_line_2": true,
              "city": true,
              "country": true,
              "county": true,
              "name": true,
              "phone": true,
              "postal_code": true,
              "postalcode_extension": true,
              "reason": "Identical match",
              "state": true
            }
          - |-
            {
              "address_line_1": true,
              "address_line_2": true,
              "city": true,
              "country": true,
              "county": true,
              "name": true,
              "phone": true,
              "postal_code": false,
              "postalcode_extension": true,
              "reason": "",
              "state": true
            }
          - |-
            {
              "address_line_1": false,
              "address_line_2": true,
              "city": true,
              "country": true,
              "county": true,
              "name": true,
              "phone": true,
              "postal_code": false,
              "postalcode_extension": true,
              "reason": "",
              "state": true
            }
      - name: VERIFICATION_STATUS_CODE
        description: The current status of a customer's verification process, indicating whether their identity has been confirmed, is pending, or has been rejected.
        expr: VERIFICATION_STATUS_CODE
        data_type: VARCHAR(16777216)
    time_dimensions:
      - name: CREATED_TIMESTAMP
        description: The date and time when the customer identifier was created.
        expr: CREATED_TIMESTAMP
        data_type: TIMESTAMP_NTZ(9)
        sample_values:
          - 2025-10-04T19:47:38.726+0000
          - 2025-10-04T19:02:14.830+0000
          - 2025-10-04T19:47:40.200+0000
      - name: UPDATED_TIMESTAMP
        description: The date and time when the customer's identifier information was last updated.
        expr: UPDATED_TIMESTAMP
        data_type: TIMESTAMP_NTZ(9)
        sample_values:
          - 2025-10-03T14:31:01.636+0000
          - 2025-10-02T16:36:47.394+0000
          - 2025-10-03T14:31:02.031+0000
    facts:
      - name: CONFIDENCE_SCORE
        description: A measure of the accuracy or reliability of the customer identification process, with higher values indicating a higher degree of confidence that the customer has been correctly identified.
        expr: CONFIDENCE_SCORE
        data_type: FLOAT
        sample_values:
          - '0.9248536142'
          - '0.9547711058'
relationships:
  - name: customer_business_id
    left_table: CUSTOMER_IDENTIFIER
    relationship_columns:
      - left_column: CUSTOMER_BUSINESS_ID
        right_column: CUSTOMER_BUSINESS_ID
    right_table: CUSTOMER_ADDRESS
verified_queries:
  - name: Show the first unprocessed incoming record
    question: Show the first unprocessed incoming record
    sql: |-
      SELECT
        ci.identifier_type,
        ci.identifier_value,
        ci.customer_name,
        ci.address_line_1,
        ci.address_line_2,
        ci.city,
        ci.county,
        ci.state,
        ci.postal_code,
        ci.postalcode_extension,
        ci.country,
        ci.phone,
        ci.customer_full_detail,
        ci.created_timestamp,
        ROUND(ci.confidence_score * 100, 2) || '%' AS confidence_score,
        round(ci.search_confidence_score * 100, 2) || '%' as search_confidence_score,
        ci.edit_distance
      FROM
        customer_identifier AS ci
      WHERE
        ci.customer_business_id IS NULL
      ORDER BY
        ci.created_timestamp DESC NULLS LAST
      LIMIT
        1
    use_as_onboarding_question: false
    verified_by: Russ Goldin
    verified_at: 1759878920
  - name: What are the bottom 3 customer addresses ranked by average confidence score of their associated customer identifiers?
    question: What are the bottom 3 customer addresses (golden records) ranked by average confidence score of their associated customer identifiers?
    sql: |-
      SELECT
        ca.customer_business_id,
        ca.customer_name,
        ca.address_line_1,
        ca.address_line_2,
        ca.city,
        ca.state,
        ca.postal_code,
        ca.country,
        ROUND(AVG(ci.confidence_score) * 100, 2) || '%' AS avg_confidence_score_percentage
      FROM
        customer_address AS ca
        LEFT OUTER JOIN customer_identifier AS ci ON ca.customer_business_id = ci.customer_business_id
      WHERE
        NOT ci.confidence_score IS NULL
      GROUP BY
        ca.customer_business_id,
        ca.customer_name,
        ca.address_line_1,
        ca.address_line_2,
        ca.city,
        ca.state,
        ca.postal_code,
        ca.country
      ORDER BY
        AVG(ci.confidence_score) ASC
      LIMIT
        3
    use_as_onboarding_question: false
    verified_by: Russ Goldin
    verified_at: 1759678529
module_custom_instructions:
  sql_generation: 'Show all confidence scores as x.xx%.  '