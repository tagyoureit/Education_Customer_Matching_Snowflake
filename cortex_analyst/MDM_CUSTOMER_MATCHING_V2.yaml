name: MDM_CUSTOMER_MATCHING_V2
tables:
  - name: CUSTOMER_ADDRESS
    synonyms: []
    description: ''
    base_table:
      database: MDM_CUSTOMER_MATCHING
      schema: PUBLIC
      table: CUSTOMER_ADDRESS
    dimensions:
      - name: ADDRESS_LINE_1
        description: The first line of the customer's mailing address.
        expr: ADDRESS_LINE_1
        data_type: VARCHAR(16777216)
        sample_values:
          - 9215 29TH ST NE
          - 2400 HIGHWAY 42 N
          - 6955 ALMEDA RD
      - name: ADDRESS_LINE_2
        description: The secondary address line for a customer's mailing address, often used to provide additional information such as a post office box or a specific building or suite number.
        expr: ADDRESS_LINE_2
        data_type: VARCHAR(16777216)
        sample_values:
          - PRIVATE BAG 51336
      - name: CITY
        description: The city where the customer resides.
        expr: CITY
        data_type: VARCHAR(16777216)
        sample_values:
          - GRAFTON
          - SEOCHO-GU
          - LAS VEGAS
      - name: COUNTRY
        description: The country where the customer is located.
        expr: COUNTRY
        data_type: VARCHAR(16777216)
        sample_values:
          - CA
          - CN
          - US
      - name: COUNTY
        description: The county where the customer resides.
        expr: COUNTY
        data_type: VARCHAR(16777216)
        sample_values:
          - ALLEGHENY
          - SUMNER
      - name: CUSTOMER_BUSINESS_ID
        description: Unique identifier for a customer's business.
        expr: CUSTOMER_BUSINESS_ID
        data_type: VARCHAR(16777216)
        sample_values:
          - CUS000000061P
          - CUS000000062Q
          - CUS0000000022
      - name: CUSTOMER_FULL_DETAIL
        description: The full address details of a customer, including the name of the organization or individual, street address, city, state, and zip code.
        expr: CUSTOMER_FULL_DETAIL
        data_type: VARCHAR(16777216)
        sample_values:
          - Eagle'S Landing Christian Acad, 2400 HIGHWAY 42 N, MCDONOUGH, US-GA, 30253-4738
          - Utah County Academy of Sciences, 940 W 800 S, OREM, US-UT, 84058-5915
          - Sargent Elementary School, 400 N 5TH ST, SARGENT, US-NE, 68874-6104
      - name: CUSTOMER_NAME
        synonyms:
          - college
          - district
          - school
          - university
        description: The name of the customer or organization associated with the address.
        expr: CUSTOMER_NAME
        data_type: VARCHAR(16777216)
        sample_values:
          - Eagle'S Landing Christian Acad
          - Aspirus Ymca Child Dev Ctr
          - Ponchatoula Junior High School
        cortex_search_service:
          database: MDM_CUSTOMER_MATCHING
          schema: PUBLIC
          service: MDM_CUSTOMER_NAME_LOOKUP
      - name: PHONE
        description: The customer's phone number.
        expr: PHONE
        data_type: VARCHAR(16777216)
        sample_values:
          - (620) 488-2421
          - (715) 926-3656
          - (412) 492-1200
      - name: POSTAL_CODE
        description: The postal code associated with a customer's address, typically used for mail delivery and geographic identification purposes.
        expr: POSTAL_CODE
        data_type: VARCHAR(16777216)
        sample_values:
          - 33076-2003
          - 33166-3165
          - 58078-1924
      - name: POSTALCODE_EXTENSION
        description: The four-digit extension of the postal code that identifies a specific geographic segment within a delivery area, such as a side of a street, a building, or a post office box.
        expr: POSTALCODE_EXTENSION
        data_type: VARCHAR(16777216)
        sample_values:
          - NOT AVAILABLE
          - '0008'
      - name: STATE
        description: The two-letter code representing the state where the customer resides, as designated by the United States Postal Service (USPS).
        expr: STATE
        data_type: VARCHAR(16777216)
        sample_values:
          - US-GA
          - US-NJ
          - US-NE
    primary_key:
      columns:
        - CUSTOMER_BUSINESS_ID
  - name: CUSTOMER_IDENTIFIER
    synonyms:
      - source_addresses
      - system_address
      - system_of_record_addresses
    description: ''
    base_table:
      database: MDM_CUSTOMER_MATCHING
      schema: PUBLIC
      table: CUSTOMER_IDENTIFIER
    dimensions:
      - name: ADDRESS_LINE_1
        description: The first line of a customer's mailing address.
        expr: ADDRESS_LINE_1
        data_type: VARCHAR(16777216)
        sample_values:
          - 2 BELKNA MOUNTAIN RD
          - 415 E FREDERICK AVE
          - 322 LAMAR AVE
      - name: ADDRESS_LINE_2
        description: The second line of a customer's mailing address, which may include additional information such as a post office box or a secondary address line.
        expr: ADDRESS_LINE_2
        data_type: VARCHAR(16777216)
        sample_values:
          - PRIVATE BAG 51336
      - name: ADDRESS_ROLE
        description: The role or purpose of the customer's address, indicating whether it is used for warehouse operations, office administration, or educational purposes.
        expr: ADDRESS_ROLE
        data_type: VARCHAR(16777216)
        sample_values:
          - WAREHOUSE
          - OFFICE
          - SCHOOL
      - name: CITY
        description: The city where the customer is located.
        expr: CITY
        data_type: VARCHAR(16777216)
        sample_values:
          - CHARLOTTE
          - CORTLAND
          - COLLEGEVILLE
      - name: COUNTRY
        description: The country of origin or residence of the customer, represented by a three-letter code (e.g. GB for United Kingdom, US/USA for United States of America).
        expr: COUNTRY
        data_type: VARCHAR(16777216)
        sample_values:
          - GB
          - US
          - USA
      - name: COUNTY
        description: The county where the customer resides.
        expr: COUNTY
        data_type: VARCHAR(16777216)
        sample_values:
          - TULARE
          - GRANT
          - MADISON
      - name: CUSTOMER_BUSINESS_ID
        description: Unique identifier for a customer's business entity.
        expr: CUSTOMER_BUSINESS_ID
        data_type: VARCHAR(16777216)
        sample_values:
          - CUS000000488K
          - CUS000000018I
          - CUS000000139V
      - name: CUSTOMER_FULL_DETAIL
        description: The full address and name of the customer, including the organization name, street address, city, state, and zip code.
