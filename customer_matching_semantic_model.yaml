name: customer_matching_data_model
description: Semantic model for customer matching validation system with test customers, valid customers, and similarity results
tables:
  - name: test_matches
    description: Incoming customer data to be matched against valid customers
    base_table:
      database: MDM_CUSTOMER_MATCHING
      schema: PUBLIC
      table: TEST_MATCHES
    primary_key:
      columns:
        - test_customer_id
    dimensions:
      - name: test_customer_id
        expr: SOURCE_PKEY
        description: Unique identifier for test customer record
        data_type: TEXT
        unique: true
      - name: test_customer_name
        expr: NAME
        description: Name of the test customer
        data_type: TEXT
        synonyms:
          - customer name
          - name
          - company name
      - name: test_source_system
        expr: SOURCE_SYSTEM
        description: Source system where the test customer data originated
        data_type: TEXT
        synonyms:
          - source
          - system
          - origin
      - name: test_address_line_1
        expr: ADDRESS_LINE_1
        description: Primary address line for test customer
        data_type: TEXT
        synonyms:
          - address
          - street address
          - address1
      - name: test_address_line_2
        expr: ADDRESS_LINE_2
        description: Secondary address line for test customer
        data_type: TEXT
        synonyms:
          - address2
          - suite
          - unit
      - name: test_city
        expr: CITY
        description: City of test customer
        data_type: TEXT
      - name: test_state
        expr: STATE
        description: State or province of test customer
        data_type: TEXT
        synonyms:
          - province
          - region
      - name: test_postal_code
        expr: POSTAL_CODE
        description: Postal code or zip code of test customer
        data_type: TEXT
        synonyms:
          - zip code
          - zip
          - postal
      - name: test_country
        expr: COUNTRY
        description: Country of test customer
        data_type: TEXT
      - name: test_customer_full_detail
        expr: CUSTOMER_FULL_DETAIL
        description: Complete concatenated customer details used for matching
        data_type: TEXT
        synonyms:
          - full details
          - complete info
      - name: test_customer_embedding
        expr: CUSTOMER_FULL_DETAIL_EMBEDDING
        description: Embedding vector for the test customer's full details
        data_type: VECTOR
  - name: valid_customers
    description: Reference customer data - the authoritative customer records
    base_table:
      database: MDM_CUSTOMER_MATCHING
      schema: PUBLIC
      table: VALID_CUSTOMERS
    primary_key:
      columns:
        - valid_customer_id
    dimensions:
      - name: valid_customer_id
        expr: ID
        description: Unique identifier for valid customer record
        data_type: TEXT
        unique: true
      - name: valid_customer_source_key
        expr: SOURCE_PKEY
        description: Source primary key for valid customer
        data_type: TEXT
      - name: valid_customer_name
        expr: NAME
        description: Name of the valid customer
        data_type: TEXT
        synonyms:
          - customer name
          - name
          - company name
      - name: valid_source_system
        expr: SOURCE_SYSTEM
        description: Source system where the valid customer data originated
        data_type: TEXT
        synonyms:
          - source
          - system
          - origin
      - name: valid_address_line_1
        expr: ADDRESS_LINE_1
        description: Primary address line for valid customer
        data_type: TEXT
        synonyms:
          - address
          - street address
          - address1
      - name: valid_address_line_2
        expr: ADDRESS_LINE_2
        description: Secondary address line for valid customer
        data_type: TEXT
        synonyms:
          - address2
          - suite
          - unit
      - name: valid_city
        expr: CITY
        description: City of valid customer
        data_type: TEXT
      - name: valid_state
        expr: STATE
        description: State or province of valid customer
        data_type: TEXT
        synonyms:
          - province
          - region
      - name: valid_postal_code
        expr: POSTAL_CODE
        description: Postal code or zip code of valid customer
        data_type: TEXT
        synonyms:
          - zip code
          - zip
          - postal
      - name: valid_country
        expr: COUNTRY
        description: Country of test customer
        data_type: TEXT
      - name: valid_customer_full_detail
        expr: CUSTOMER_FULL_DETAIL
        description: Complete concatenated customer details
        data_type: TEXT
        synonyms:
          - full details
          - complete info
      - name: valid_customer_embedding
        expr: CUSTOMER_FULL_DETAIL_EMBEDDING_VECTOR
        description: Embedding vector for the valid customer's full details
        data_type: VECTOR
  - name: customer_match_results
    description: Precomputed similarity results between test and valid customers
    base_table:
      database: MDM_CUSTOMER_MATCHING
      schema: PUBLIC
      table: CUSTOMER_MATCH_RESULTS
    primary_key:
      columns:
        - test_match_id
        - valid_match_id
    dimensions:
      - name: match_category
        expr: MATCH_CATEGORY
        description: 'Category of match quality: EXACT, VERY_CLOSE, SOMEWHAT_CLOSE, NOT_CLOSE'
        data_type: TEXT
        synonyms:
          - match type
          - similarity category
          - match quality
        sample_values:
          - EXACT
          - VERY_CLOSE
          - SOMEWHAT_CLOSE
          - NOT_CLOSE
        is_enum: true
      - name: valid_match_id
        expr: VALID_ID
        description: ID of the valid customer in the match
        data_type: TEXT
      - name: test_match_id
        expr: TEST_ID
        description: ID of the test customer in the match
        data_type: TEXT
      - name: valid_match_details
        expr: VALID_CUSTOMER_FULL_DETAIL
        description: Full details of the valid customer in the match
        data_type: TEXT
      - name: test_match_details
        expr: TEST_CUSTOMER_FULL_DETAIL
        description: Full details of the test customer in the match
        data_type: TEXT
    facts:
      - name: similarity_score
        expr: SIMILARITY_SCORE
        description: Vector cosine similarity score between 0 and 1, where 1 is perfect match
        data_type: NUMBER
        default_aggregation: avg
        synonyms:
          - similarity
          - match score
          - cosine similarity
      - name: similarity_percentage
        expr: SIMILARITY_SCORE * 100
        description: Similarity score as a percentage (0-100%)
        data_type: NUMBER
        default_aggregation: avg
        synonyms:
          - similarity percent
          - match percentage
      - name: match_count
        expr: '1'
        description: Count of match records
        data_type: NUMBER
        default_aggregation: sum
        synonyms:
          - count
          - number of matches
    time_dimensions:
      - name: created_timestamp
        expr: CREATED_TIMESTAMP
        description: When the match result was created
        data_type: TIMESTAMP_NTZ
      - name: updated_timestamp
        expr: UPDATED_TIMESTAMP
        description: When the match result was last updated
        data_type: TIMESTAMP_NTZ
relationships:
  - name: test_to_match_results
    left_table: customer_match_results
    right_table: test_matches
    relationship_columns:
      - left_column: test_match_id
        right_column: test_customer_id
    join_type: left_outer
    relationship_type: many_to_one
  - name: valid_to_match_results
    left_table: customer_match_results
    right_table: valid_customers
    relationship_columns:
      - left_column: valid_match_id
        right_column: valid_customer_id
    join_type: left_outer
    relationship_type: many_to_one
verified_queries:
  - name: exact_matches
    question: Which test customers are exact matches?
    sql: |
      SELECT 
        t.test_customer_id, 
        t.test_customer_name, 
        cmr.similarity_score, 
        cmr.valid_match_id AS matched_valid_customer_id 
      FROM test_matches AS t 
      JOIN customer_match_results AS cmr ON t.test_customer_id = cmr.test_match_id 
      WHERE cmr.match_category = 'EXACT' 
      ORDER BY cmr.similarity_score DESC
    verified_at: 1705000000
    verified_by: System Admin
  - name: similarity_range
    question: Which test customers match between 95-97%?
    sql: |
      SELECT 
        t.test_customer_id, 
        t.test_customer_name, 
        cmr.similarity_percentage, 
        cmr.valid_match_id AS matched_valid_customer_id 
      FROM test_matches AS t 
      JOIN customer_match_results AS cmr ON t.test_customer_id = cmr.test_match_id 
      WHERE cmr.similarity_percentage >= 95 AND cmr.similarity_percentage <= 97 
      ORDER BY cmr.similarity_score DESC
    verified_at: 1705000000
    verified_by: System Admin
  - name: very_close_matches
    question: Which test customers are a very close match?
    sql: |
      SELECT 
        t.test_customer_id, 
        t.test_customer_name, 
        cmr.similarity_percentage, 
        cmr.valid_match_id AS matched_valid_customer_id, 
        cmr.valid_match_details AS matched_customer_details 
      FROM test_matches AS t 
      JOIN customer_match_results AS cmr ON t.test_customer_id = cmr.test_match_id 
      WHERE cmr.match_category = 'VERY_CLOSE' 
      ORDER BY cmr.similarity_score DESC
    verified_at: 1705000000
    verified_by: System Admin
  - name: Show me the test_match with source_pkey ='TEST_0FCD7224E341' and the top 5 valid matches using dynamic calculation
    question: Show me the test_match with source_pkey ='TEST_0FCD7224E341' and the top 5 valid matches using dynamic calculation
    sql: |-
      SELECT
        v.valid_customer_id,
        v.valid_customer_full_detail,
        t.test_customer_id,
        t.test_customer_full_detail,
        VECTOR_COSINE_SIMILARITY(
          v.valid_customer_embedding,
          t.test_customer_embedding
        ) AS similarity_score,
        CASE
          WHEN similarity_score >=.995 THEN 'EXACT'
          WHEN similarity_score >=.95 THEN 'VERY_CLOSE'
          WHEN similarity_score >=.92 THEN 'SOMEWHAT_CLOSE'
          ELSE 'NOT_CLOSE'
        END AS match_category
      FROM
        valid_customers AS v
        CROSS JOIN test_matches AS t
      WHERE
        v.valid_customer_embedding IS NOT NULL
        AND t.test_customer_embedding IS NOT NULL
        AND t.test_customer_id = 'TEST_0FCD7224E341' QUALIFY ROW_NUMBER() OVER (
          PARTITION BY t.test_customer_id
          ORDER BY
            similarity_score DESC
        ) <= 5
    use_as_onboarding_question: false
    verified_by: Russ Goldin
    verified_at: 1754674022
  - name: test_customers_top_10
    question: Give me the first 10 customers in the test entry table.
    sql: |-
      SELECT
        t.test_customer_id,
        t.test_customer_name,
        t.test_customer_full_detail
      FROM
        test_matches AS t
      LIMIT
        10
    use_as_onboarding_question: false
    verified_by: Russ Goldin
    verified_at: 1754674286
  - name: top_matches_for_customer
    question: Show me the top 5 matches for test customer with a specific ID
    sql: |-
      SELECT
        v.valid_customer_id,
        v.valid_customer_full_detail,
        t.test_customer_id,
        t.test_customer_full_detail,
        VECTOR_COSINE_SIMILARITY(
          v.valid_customer_embedding,
          t.test_customer_embedding
        ) AS similarity_score,
        CASE
          WHEN similarity_score >= 0.995 THEN 'EXACT'
          WHEN similarity_score >= 0.95 THEN 'VERY_CLOSE'
          WHEN similarity_score >= 0.92 THEN 'SOMEWHAT_CLOSE'
          ELSE 'NOT_CLOSE'
        END AS match_category
      FROM
        valid_customers AS v
        CROSS JOIN test_matches AS t
      WHERE
        v.valid_customer_embedding IS NOT NULL
        AND t.test_customer_embedding IS NOT NULL
        AND t.test_customer_id = '<CUSTOMER_ID>'
      QUALIFY ROW_NUMBER() OVER (
        PARTITION BY t.test_customer_id
        ORDER BY similarity_score DESC
      ) <= 5
    use_as_onboarding_question: false
    verified_by: Russ Goldin
    verified_at: 1754674500
  - name: search_customers_by_name
    question: Show me matches for customers containing a specific name or school
    sql: |-
      SELECT 
        t.test_customer_id,
        t.test_customer_name,
        t.test_customer_full_detail,
        cmr.similarity_percentage,
        cmr.valid_match_id as matched_valid_customer_id,
        cmr.valid_match_details,
        cmr.match_category
      FROM test_matches t
      JOIN customer_match_results cmr ON t.test_customer_id = cmr.test_match_id
      WHERE UPPER(t.test_customer_name) LIKE UPPER('%<SEARCH_TERM>%') 
         OR UPPER(t.test_customer_full_detail) LIKE UPPER('%<SEARCH_TERM>%')
      ORDER BY cmr.similarity_score DESC
    use_as_onboarding_question: false
    verified_by: Russ Goldin
    verified_at: 1754674600
  - name: direct_customer_comparison
    question: Compare a specific test customer with a specific valid customer
    sql: |-
      SELECT 
        t.test_customer_id,
        t.test_customer_name,
        t.test_customer_full_detail as test_details,
        v.valid_customer_id,
        v.valid_customer_full_detail as valid_details,
        VECTOR_COSINE_SIMILARITY(v.valid_customer_embedding, t.test_customer_embedding) * 100 as similarity_percentage,
        CASE 
          WHEN VECTOR_COSINE_SIMILARITY(v.valid_customer_embedding, t.test_customer_embedding) >= 0.995 THEN 'EXACT'
          WHEN VECTOR_COSINE_SIMILARITY(v.valid_customer_embedding, t.test_customer_embedding) >= 0.980 THEN 'VERY_CLOSE'
          WHEN VECTOR_COSINE_SIMILARITY(v.valid_customer_embedding, t.test_customer_embedding) >= 0.920 THEN 'SOMEWHAT_CLOSE'
          ELSE 'NOT_CLOSE'
        END AS match_category
      FROM test_matches t
      CROSS JOIN valid_customers v
      WHERE t.test_customer_id = '<TEST_ID>' 
      AND v.valid_customer_id = '<VALID_ID>'
    use_as_onboarding_question: false
    verified_by: Russ Goldin
    verified_at: 1754674700